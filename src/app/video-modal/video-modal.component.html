<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Ejercicio</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrarModal()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <iframe
    width="100%"
    height="220"
    [src]="videoUrl | safe"
    frameborder="0"
    allowfullscreen>
  </iframe>
  <p class="ion-padding-top">{{ descripcion }}</p>
</ion-content>
