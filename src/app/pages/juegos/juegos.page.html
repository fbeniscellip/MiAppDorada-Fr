<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Juegos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Card: Memorice de Naipes -->
  <ion-card class="juego-card memorice-card" routerLink="/juegos/memorice">
    <ion-card-header>
      <ion-card-title>🃏 Memorice de Naipes</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      Juego de memoria visual con cartas. Ideal para ejercitar la mente.
    </ion-card-content>
  </ion-card>

  <!-- Card: Juego de Colores -->
  <ion-card class="juego-card colores-card" routerLink="/juegos/colores">
    <ion-card-header>
      <ion-card-title>🎨 Juego de Colores</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      Encuentra el color diferente. Ejercita tu percepción visual y atención.
    </ion-card-content>
  </ion-card>

</ion-content>
